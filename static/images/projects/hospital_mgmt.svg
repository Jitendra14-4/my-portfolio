<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_hosp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#091817" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg_hosp)" />

  <!-- Window Header -->
  <rect x="40" y="30" width="720" height="40" rx="8" fill="#1e293b" />
  <circle cx="65" cy="50" r="6" fill="#ef4444" />
  <circle cx="85" cy="50" r="6" fill="#eab308" />
  <circle cx="105" cy="50" r="6" fill="#10b981" />
  <text x="400" y="55" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="14" text-anchor="middle">CarePulse Hospital Management &amp; Clinical Records — Django + REST</text>

  <!-- Main Canvas -->
  <rect x="40" y="70" width="720" height="390" fill="#0b1329" stroke="#134e4a" stroke-width="1" />

  <!-- Top Metrics Bar -->
  <g transform="translate(60, 90)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="155" height="70" rx="8" fill="#132a2f" stroke="#0d9488" stroke-width="1"/>
    <text x="15" y="24" fill="#5eead4" font-family="sans-serif" font-size="11">OPD Appointments</text>
    <text x="15" y="52" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">324</text>
    <text x="95" y="50" fill="#10b981" font-family="sans-serif" font-size="11">Today</text>

    <!-- Metric 2 -->
    <rect x="170" y="0" width="155" height="70" rx="8" fill="#132a2f" stroke="#0d9488" stroke-width="1"/>
    <text x="185" y="24" fill="#5eead4" font-family="sans-serif" font-size="11">Active Doctors</text>
    <text x="185" y="52" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">42</text>
    <text x="255" y="50" fill="#06b6d4" font-family="sans-serif" font-size="11">On Duty</text>

    <!-- Metric 3 -->
    <rect x="340" y="0" width="165" height="70" rx="8" fill="#132a2f" stroke="#0d9488" stroke-width="1"/>
    <text x="355" y="24" fill="#5eead4" font-family="sans-serif" font-size="11">ICU &amp; Ward Beds</text>
    <text x="355" y="52" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">88%</text>
    <text x="430" y="50" fill="#f59e0b" font-family="sans-serif" font-size="11">Capacity</text>

    <!-- Metric 4 -->
    <rect x="520" y="0" width="160" height="70" rx="8" fill="#132a2f" stroke="#0d9488" stroke-width="1"/>
    <text x="535" y="24" fill="#5eead4" font-family="sans-serif" font-size="11">Pharmacy Orders</text>
    <text x="535" y="52" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">512</text>
    <text x="610" y="50" fill="#10b981" font-family="sans-serif" font-size="11">Processed</text>
  </g>

  <!-- ECG / Vital Monitoring Waveform -->
  <rect x="60" y="175" width="410" height="130" rx="8" fill="#0f1f26" stroke="#115e59" />
  <text x="75" y="200" fill="#5eead4" font-family="sans-serif" font-size="13" font-weight="bold">Patient Vital Monitor Stream</text>
  <!-- ECG path -->
  <path d="M 75 250 L 140 250 L 155 220 L 170 280 L 185 200 L 200 270 L 215 250 L 270 250 L 285 210 L 300 290 L 315 190 L 330 265 L 345 250 L 450 250" 
        fill="none" stroke="url(#cyanLine)" stroke-width="3" stroke-linecap="round" />
  <text x="375" y="205" fill="#10b981" font-family="monospace" font-size="13" font-weight="bold">76 BPM Normal</text>

  <!-- Doctor Schedule / Queue -->
  <rect x="490" y="175" width="250" height="260" rx="8" fill="#0f1f26" stroke="#115e59" />
  <text x="505" y="202" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="bold">Doctor Consultation Queue</text>
  
  <g font-family="sans-serif" font-size="11">
    <rect x="505" y="215" width="220" height="42" rx="6" fill="#16383b" />
    <text x="515" y="233" fill="#ffffff" font-weight="600">Dr. Rajesh Mishra (Cardiology)</text>
    <text x="515" y="247" fill="#5eead4">Next: Token #14 • Room 102</text>

    <rect x="505" y="265" width="220" height="42" rx="6" fill="#16383b" />
    <text x="515" y="283" fill="#ffffff" font-weight="600">Dr. Ananya Roy (Neurology)</text>
    <text x="515" y="297" fill="#5eead4">Next: Token #08 • Room 204</text>

    <rect x="505" y="315" width="220" height="42" rx="6" fill="#16383b" />
    <text x="515" y="333" fill="#ffffff" font-weight="600">Dr. Vivek Sharma (Orthopedics)</text>
    <text x="515" y="347" fill="#5eead4">Next: Token #22 • Room 108</text>

    <rect x="505" y="365" width="220" height="42" rx="6" fill="#16383b" />
    <text x="515" y="383" fill="#ffffff" font-weight="600">Dr. Meera Iyer (Pediatrics)</text>
    <text x="515" y="397" fill="#5eead4">Next: Token #05 • Room 301</text>
  </g>

  <!-- Prescription & Billing Summary -->
  <rect x="60" y="320" width="410" height="115" rx="8" fill="#0f1f26" stroke="#115e59" />
  <text x="75" y="345" fill="#5eead4" font-family="sans-serif" font-size="13" font-weight="bold">Prescription &amp; EHR Integration</text>
  <text x="75" y="375" fill="#cbd5e1" font-family="sans-serif" font-size="11">✓ Digital Health Records with ICD-10 Diagnostic Codes</text>
  <text x="75" y="395" fill="#cbd5e1" font-family="sans-serif" font-size="11">✓ Automated Invoice Billing &amp; Mediclaim Insurance Claims</text>
  <text x="75" y="415" fill="#10b981" font-family="sans-serif" font-size="11">✓ HIPAA &amp; NDHM Data Security Protocols Compliant</text>
</svg>
