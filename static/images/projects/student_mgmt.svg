<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_stud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg_stud)" />

  <!-- Window Header -->
  <rect x="40" y="30" width="720" height="40" rx="8" fill="#1e293b" />
  <circle cx="65" cy="50" r="6" fill="#ef4444" />
  <circle cx="85" cy="50" r="6" fill="#eab308" />
  <circle cx="105" cy="50" r="6" fill="#10b981" />
  <text x="400" y="55" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="14" text-anchor="middle">Student Management Dashboard — Django Enterprise</text>

  <!-- Main Canvas -->
  <rect x="40" y="70" width="720" height="390" fill="#0f172a" stroke="#334155" stroke-width="1" />

  <!-- Sidebar -->
  <rect x="50" y="80" width="160" height="370" rx="6" fill="#1e293b" />
  <text x="70" y="115" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="14">🎓 EDU PORTAL</text>
  
  <rect x="65" y="140" width="130" height="30" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
  <text x="80" y="160" fill="#38bdf8" font-family="sans-serif" font-size="12">📊 Dashboard</text>
  <text x="80" y="200" fill="#94a3b8" font-family="sans-serif" font-size="12">👨‍🎓 Students List</text>
  <text x="80" y="235" fill="#94a3b8" font-family="sans-serif" font-size="12">📚 Course Catalog</text>
  <text x="80" y="270" fill="#94a3b8" font-family="sans-serif" font-size="12">📝 Examination</text>
  <text x="80" y="305" fill="#94a3b8" font-family="sans-serif" font-size="12">📈 Attendance</text>
  <text x="80" y="340" fill="#94a3b8" font-family="sans-serif" font-size="12">⚙️ System Config</text>

  <!-- Stat Cards -->
  <g transform="translate(230, 85)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="155" height="75" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="15" y="25" fill="#94a3b8" font-family="sans-serif" font-size="11">Total Students</text>
    <text x="15" y="55" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold">1,842</text>
    <text x="105" y="55" fill="#10b981" font-family="sans-serif" font-size="12">↑ 12%</text>

    <!-- Card 2 -->
    <rect x="170" y="0" width="155" height="75" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="185" y="25" fill="#94a3b8" font-family="sans-serif" font-size="11">Active Courses</text>
    <text x="185" y="55" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold">48</text>
    <text x="275" y="55" fill="#38bdf8" font-family="sans-serif" font-size="12">Live</text>

    <!-- Card 3 -->
    <rect x="340" y="0" width="175" height="75" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="355" y="25" fill="#94a3b8" font-family="sans-serif" font-size="11">Avg Attendance</text>
    <text x="355" y="55" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold">94.6%</text>
    <text x="455" y="55" fill="#10b981" font-family="sans-serif" font-size="12">High</text>
  </g>

  <!-- Attendance / Performance Chart -->
  <rect x="230" y="180" width="310" height="150" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="245" y="205" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">Semester Grade Distribution</text>
  <!-- Chart Bars -->
  <rect x="255" y="280" width="28" height="40" rx="4" fill="url(#barGrad)" />
  <rect x="295" y="250" width="28" height="70" rx="4" fill="url(#barGrad)" />
  <rect x="335" y="230" width="28" height="90" rx="4" fill="url(#barGrad)" />
  <rect x="375" y="220" width="28" height="100" rx="4" fill="#10b981" />
  <rect x="415" y="240" width="28" height="80" rx="4" fill="url(#barGrad)" />
  <rect x="455" y="270" width="28" height="50" rx="4" fill="url(#barGrad)" />
  <rect x="495" y="295" width="28" height="25" rx="4" fill="url(#barGrad)" />

  <!-- Recent Enrollments Table -->
  <rect x="555" y="180" width="190" height="255" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="570" y="205" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">Recent Enrolled</text>
  <g font-family="sans-serif" font-size="11">
    <circle cx="580" cy="235" r="10" fill="#38bdf8" />
    <text x="600" y="238" fill="#f8fafc">Aarav Sharma</text>
    <text x="600" y="250" fill="#64748b">CS - Sem 3</text>

    <circle cx="580" cy="285" r="10" fill="#10b981" />
    <text x="600" y="288" fill="#f8fafc">Pooja Patel</text>
    <text x="600" y="300" fill="#64748b">AI &amp; DS - Sem 1</text>

    <circle cx="580" cy="335" r="10" fill="#818cf8" />
    <text x="600" y="338" fill="#f8fafc">Rohan Verma</text>
    <text x="600" y="350" fill="#64748b">IT - Sem 5</text>

    <circle cx="580" cy="385" r="10" fill="#f59e0b" />
    <text x="600" y="388" fill="#f8fafc">Sneha Roy</text>
    <text x="600" y="400" fill="#64748b">CS - Sem 2</text>
  </g>

  <!-- Quick Info Bottom -->
  <rect x="230" y="345" width="310" height="90" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="245" y="370" fill="#38bdf8" font-family="monospace" font-size="12">Django ORM &amp; Role Authentication</text>
  <text x="245" y="395" fill="#94a3b8" font-family="sans-serif" font-size="11">✓ Role-Based Access Control (Admin, Staff, Student)</text>
  <text x="245" y="415" fill="#94a3b8" font-family="sans-serif" font-size="11">✓ Automated PDF Marksheet &amp; Report Cards</text>
</svg>
