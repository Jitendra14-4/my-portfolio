<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_pred" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#141e3c" />
      <stop offset="100%" stop-color="#070c1b" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="12" fill="url(#bg_pred)" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="50" y1="100" x2="750" y2="100" />
    <line x1="50" y1="170" x2="750" y2="170" />
    <line x1="50" y1="240" x2="750" y2="240" />
    <line x1="50" y1="310" x2="750" y2="310" />
    <line x1="50" y1="380" x2="750" y2="380" />
    
    <line x1="120" y1="70" x2="120" y2="420" />
    <line x1="220" y1="70" x2="220" y2="420" />
    <line x1="320" y1="70" x2="320" y2="420" />
    <line x1="420" y1="70" x2="420" y2="420" />
    <line x1="520" y1="70" x2="520" y2="420" />
    <line x1="620" y1="70" x2="620" y2="420" />
    <line x1="720" y1="70" x2="720" y2="420" />
  </g>

  <!-- Window Header Bar -->
  <rect x="40" y="24" width="720" height="38" rx="8" fill="#1e293b" />
  <circle cx="65" cy="43" r="6" fill="#ef4444" />
  <circle cx="85" cy="43" r="6" fill="#f59e0b" />
  <circle cx="105" cy="43" r="6" fill="#10b981" />
  <text x="400" y="48" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Student Marks Prediction System — Scikit-Learn Regression &amp; Analytics</text>

  <!-- Left Prediction Gauge Card -->
  <rect x="50" y="80" width="220" height="370" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <text x="70" y="115" fill="#a855f7" font-family="sans-serif" font-weight="bold" font-size="13">🤖 ML PREDICTOR</text>
  
  <!-- Metric Rings -->
  <circle cx="160" cy="190" r="60" fill="none" stroke="#1e293b" stroke-width="10" />
  <circle cx="160" cy="190" r="60" fill="none" stroke="url(#purpleGrad)" stroke-width="10" stroke-dasharray="377" stroke-dashoffset="65" stroke-linecap="round" filter="url(#glowEffect)" />
  <text x="160" y="185" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">92.4%</text>
  <text x="160" y="205" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Predicted Score</text>

  <!-- Input Features in Card -->
  <g transform="translate(65, 275)" font-family="sans-serif" font-size="11">
    <rect x="0" y="0" width="190" height="32" rx="6" fill="#1e293b" />
    <text x="12" y="20" fill="#94a3b8">Study Hours:</text>
    <text x="145" y="20" fill="#38bdf8" font-weight="bold">6.5 hrs/day</text>

    <rect x="0" y="40" width="190" height="32" rx="6" fill="#1e293b" />
    <text x="12" y="60" fill="#94a3b8">Attendance:</text>
    <text x="155" y="60" fill="#10b981" font-weight="bold">94.8%</text>

    <rect x="0" y="80" width="190" height="32" rx="6" fill="#1e293b" />
    <text x="12" y="100" fill="#94a3b8">Model Accuracy:</text>
    <text x="145" y="100" fill="#a855f7" font-weight="bold">R² = 0.91</text>
  </g>

  <!-- Right Regression Plot & Features -->
  <rect x="290" y="80" width="460" height="370" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  
  <text x="315" y="115" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="14">📈 Study Hours vs. Examination Grade Regression Fit</text>

  <!-- Mini Stat Badges -->
  <g transform="translate(315, 135)">
    <rect x="0" y="0" width="125" height="42" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="12" y="18" fill="#94a3b8" font-family="sans-serif" font-size="10">Samples Evaluated</text>
    <text x="12" y="34" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">2,500 Records</text>

    <rect x="140" y="0" width="125" height="42" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="12" y="18" fill="#94a3b8" font-family="sans-serif" font-size="10">MSE Loss</text>
    <text x="12" y="34" fill="#10b981" font-family="sans-serif" font-size="14" font-weight="bold">0.038 (Optimal)</text>

    <rect x="280" y="0" width="125" height="42" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="12" y="18" fill="#94a3b8" font-family="sans-serif" font-size="10">Algorithm</text>
    <text x="12" y="34" fill="#a855f7" font-family="sans-serif" font-size="14" font-weight="bold">Random Forest</text>
  </g>

  <!-- Coordinate Graph Area -->
  <g transform="translate(320, 200)">
    <!-- Axes -->
    <line x1="30" y1="20" x2="30" y2="200" stroke="#475569" stroke-width="2" />
    <line x1="30" y1="200" x2="400" y2="200" stroke="#475569" stroke-width="2" />
    
    <!-- Ticks & Labels -->
    <text x="25" y="25" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="end">100</text>
    <text x="25" y="70" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="end">75</text>
    <text x="25" y="115" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="end">50</text>
    <text x="25" y="160" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="end">25</text>
    
    <text x="70" y="218" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">2h</text>
    <text x="150" y="218" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">4h</text>
    <text x="230" y="218" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">6h</text>
    <text x="310" y="218" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">8h</text>
    <text x="380" y="218" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">10h</text>

    <!-- Data Points Scatter (Students) -->
    <circle cx="65" cy="175" r="4" fill="#38bdf8" opacity="0.7"/>
    <circle cx="85" cy="160" r="4" fill="#38bdf8" opacity="0.8"/>
    <circle cx="110" cy="155" r="4" fill="#38bdf8" opacity="0.7"/>
    <circle cx="140" cy="130" r="4" fill="#38bdf8" opacity="0.8"/>
    <circle cx="165" cy="125" r="4" fill="#38bdf8" opacity="0.7"/>
    <circle cx="190" cy="110" r="4" fill="#38bdf8" opacity="0.8"/>
    <circle cx="215" cy="98" r="4" fill="#38bdf8" opacity="0.8"/>
    <circle cx="240" cy="85" r="4" fill="#38bdf8" opacity="0.7"/>
    <circle cx="270" cy="72" r="4" fill="#38bdf8" opacity="0.8"/>
    <circle cx="300" cy="58" r="4" fill="#38bdf8" opacity="0.9"/>
    <circle cx="330" cy="46" r="4" fill="#38bdf8" opacity="0.8"/>
    <circle cx="360" cy="38" r="4" fill="#38bdf8" opacity="0.9"/>

    <!-- Regression Best Fit Line -->
    <path d="M 40 185 Q 200 115 380 35" fill="none" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glowEffect)" />
    
    <!-- Shaded Confidence Interval Ribbon -->
    <path d="M 40 175 Q 200 105 380 25 L 380 45 Q 200 125 40 195 Z" fill="#8b5cf6" fill-opacity="0.15" />

    <!-- Current Prediction Point Marker -->
    <circle cx="270" cy="72" r="8" fill="#10b981" stroke="#f8fafc" stroke-width="2" filter="url(#glowEffect)" />
    <text x="280" y="65" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">Target Score: 92.4%</text>
  </g>
</svg>
