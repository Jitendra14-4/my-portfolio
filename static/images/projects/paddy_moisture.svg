<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_paddy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#14342b" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg_paddy)" />

  <!-- Window Header -->
  <rect x="40" y="30" width="720" height="40" rx="8" fill="#1e293b" />
  <circle cx="65" cy="50" r="6" fill="#ef4444" />
  <circle cx="85" cy="50" r="6" fill="#eab308" />
  <circle cx="105" cy="50" r="6" fill="#10b981" />
  <text x="400" y="55" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-size="14" text-anchor="middle">AgriTech IoT &amp; Machine Learning — Paddy Grain Moisture Detection</text>

  <!-- Main Canvas -->
  <rect x="40" y="70" width="720" height="390" fill="#0b1a19" stroke="#047857" stroke-width="1" />

  <!-- Left: Moisture Gauge & Realtime Status -->
  <rect x="60" y="90" width="320" height="230" rx="10" fill="#112926" stroke="#059669" />
  <text x="80" y="120" fill="#a7f3d0" font-family="sans-serif" font-size="14" font-weight="bold">🌾 Real-Time Moisture Predictor</text>

  <!-- Circular Dial Gauge -->
  <g transform="translate(220, 215)">
    <!-- Dial arc background -->
    <path d="M -80 0 A 80 80 0 0 1 80 0" fill="none" stroke="#334155" stroke-width="14" stroke-linecap="round"/>
    <!-- Dial active arc -->
    <path d="M -80 0 A 80 80 0 0 1 45 -66" fill="none" stroke="url(#gaugeGrad)" stroke-width="14" stroke-linecap="round"/>
    <!-- Needle -->
    <line x1="0" y1="0" x2="35" y2="-55" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <circle cx="0" cy="0" r="8" fill="#10b981" />
    
    <text x="0" y="30" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle">13.8%</text>
    <text x="0" y="50" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SAFE FOR STORAGE (Optimal)</text>
  </g>

  <!-- Right: ML Model Analysis & Predictions -->
  <rect x="400" y="90" width="340" height="230" rx="10" fill="#112926" stroke="#059669" />
  <text x="420" y="120" fill="#a7f3d0" font-family="sans-serif" font-size="14" font-weight="bold">🧠 Random Forest Regressor &amp; Sensor Telemetry</text>
  
  <!-- Telemetry Row 1 -->
  <g transform="translate(420, 140)">
    <rect x="0" y="0" width="145" height="60" rx="6" fill="#1a3d38" />
    <text x="12" y="22" fill="#94a3b8" font-family="sans-serif" font-size="11">Capacitive Sensor</text>
    <text x="12" y="46" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold">482 mV</text>

    <rect x="155" y="0" width="145" height="60" rx="6" fill="#1a3d38" />
    <text x="167" y="22" fill="#94a3b8" font-family="sans-serif" font-size="11">Ambient Temp</text>
    <text x="167" y="46" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold">28.4 °C</text>
  </g>

  <!-- Telemetry Row 2 -->
  <g transform="translate(420, 215)">
    <rect x="0" y="0" width="145" height="60" rx="6" fill="#1a3d38" />
    <text x="12" y="22" fill="#94a3b8" font-family="sans-serif" font-size="11">Relative Humidity</text>
    <text x="12" y="46" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold">64.2%</text>

    <rect x="155" y="0" width="145" height="60" rx="6" fill="#1a3d38" />
    <text x="167" y="22" fill="#94a3b8" font-family="sans-serif" font-size="11">Model R² Score</text>
    <text x="167" y="46" fill="#34d399" font-family="sans-serif" font-size="18" font-weight="bold">0.968</text>
  </g>

  <!-- Lower Section: Historical Trends & Storage Recommendation -->
  <rect x="60" y="335" width="680" height="105" rx="8" fill="#112926" stroke="#059669" />
  <g transform="translate(80, 355)">
    <text x="0" y="15" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold">Automated Advisory &amp; Spoilage Prevention:</text>
    <text x="0" y="40" fill="#cbd5e1" font-family="sans-serif" font-size="12">✓ Moisture levels below 14% prevent fungal Aspergillus contamination and insect infestation.</text>
    <text x="0" y="62" fill="#cbd5e1" font-family="sans-serif" font-size="12">✓ Automated buzzer alerts and SMS notifications dispatched to storage facility manager.</text>
  </g>
</svg>
